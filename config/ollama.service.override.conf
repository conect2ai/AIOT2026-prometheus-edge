# /etc/systemd/system/ollama.service.d/override.conf
# RECOMENDACAO OPCIONAL para o Raspberry Pi 5 — NAO usada nas rodadas avaliadas
# no artigo (o servico rodou com os padroes do Ollama 0.32.6; ver
# config/README.md e docs/RASPBERRY_PI.md, secao 3). Se aplicar, revalide com o
# protocolo antes de comparar com os numeros publicados.
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=-1"
